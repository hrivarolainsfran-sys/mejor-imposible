<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mejor Imposible</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Juego de fiesta: ordená cinco cosas buenísimas del 1 al 5 y adiviná cómo las ordena la estrella de la ronda. Con un celular o uno cada uno.">
<meta name="theme-color" content="#170B2B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22%3E%3Crect width=%2240%22 height=%2240%22 rx=%2212%22 fill=%22%232B1252%22/%3E%3Cpath d=%22M20 5l3.6 11.4L35 20l-11.4 3.6L20 35l-3.6-11.4L5 20l11.4-3.6z%22 fill=%22%23FFCB4C%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
/* Layout: una columna angosta sobre un cielo de noche de gala; paneles de vidrio y las cartas como boletos dorados troquelados */
:root{
  --night:#170B2B; --night2:#2B1252; --text:#F7F0FF; --soft:#CBB9EC; --ink:#1E0F33; --paper:#FFF8EA; --paper2:#FFEBC6; --muted:#6E5C8C;
  --gold:#FFCB4C; --gold2:#F59E2B; --pink:#FF5FA2; --mint:#5FE3C0; --sky:#62C6FF; --lav:#B49BFF; --orange:#FFA552;
  --h1:#B49BFF; --h2:#62C6FF; --h3:#5FE3C0; --h4:#FF5FA2; --h5:#FFCB4C;
  --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.12); --edge:rgba(255,255,255,.16);
  --ok:#5FE3C0; --bad:#FF7A88; --scrim:rgba(10,4,20,.72);
  --goldtext:linear-gradient(180deg,#FFF0B8 0%,#FFCB4C 48%,#F59E2B 100%);
  --display:"Shrikhand","Cooper Black","Georgia",serif;
  --body:"Bricolage Grotesque","Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--night); color:var(--text);
  font-family:var(--body); font-size:16px; line-height:1.45; font-weight:500;
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(ellipse 90% 55% at 10% -8%, rgba(255,95,162,.30), transparent 62%),
    radial-gradient(ellipse 70% 45% at 105% 18%, rgba(98,198,255,.20), transparent 60%),
    radial-gradient(ellipse 80% 50% at 50% 115%, rgba(255,203,76,.16), transparent 60%),
    linear-gradient(180deg, var(--night2), var(--night) 65%);
}
body::after{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.7;
  background-image:
    radial-gradient(1.4px 1.4px at 22px 34px, #fff, transparent),
    radial-gradient(1px 1px at 120px 80px, #fff, transparent),
    radial-gradient(1.6px 1.6px at 170px 150px, #FFE7A3, transparent),
    radial-gradient(1px 1px at 60px 170px, #fff, transparent),
    radial-gradient(1.2px 1.2px at 210px 40px, #FFD0E6, transparent);
  background-size:240px 220px;
  animation:twinkle 5s ease-in-out infinite alternate;
}
.wrap{
  max-width:560px; margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:14px 48px;
  display:flex; flex-direction:column; gap:18px;
}
.wrap.enter > *{animation:rise .45s cubic-bezier(.2,.9,.3,1.1) both}
.wrap.enter > *:nth-child(2){animation-delay:.05s} .wrap.enter > *:nth-child(3){animation-delay:.1s}
.wrap.enter > *:nth-child(4){animation-delay:.15s} .wrap.enter > *:nth-child(5){animation-delay:.2s}
.wrap.enter > *:nth-child(n+6){animation-delay:.25s}
h1,h2,h3{font-family:var(--display); font-weight:400; margin:0; text-wrap:balance; letter-spacing:.01em}
h1{font-size:clamp(2.2rem, 10vw, 3rem); line-height:1.05; background:var(--goldtext); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
h2{font-size:1.5rem; line-height:1.1; color:var(--text)}
p{margin:0}
.eyebrow{font-size:.74rem; font-weight:800; text-transform:uppercase; letter-spacing:.14em; color:var(--soft)}
.hint{color:var(--soft); font-size:.93rem}
.stack{display:flex; flex-direction:column; gap:10px}
.center{text-align:center; align-items:center}
.wait{color:var(--text); text-align:center; font-weight:700; padding:14px; background:var(--glass); border:1.5px dashed var(--edge); border-radius:18px}
.err{color:#FFC2CA; font-weight:700; background:rgba(255,122,136,.14); border:1px solid rgba(255,122,136,.5); border-radius:12px; padding:8px 12px}

/* barra superior */
.top{display:flex; align-items:center; gap:6px}
.brand{font-family:var(--display); font-size:1rem; color:var(--text); margin-right:auto; white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis; padding-right:4px}
.brand span{color:var(--gold)}
@media (max-width:420px){ .top:has(.pill) .brand span{display:none} .top:has(.pill) .brand::after{content:" ✦"; color:var(--gold)} }
.pill{font-size:.8rem; font-weight:800; padding:5px 11px; border-radius:999px; background:var(--glass); border:1px solid var(--edge); color:var(--text); font-variant-numeric:tabular-nums; white-space:nowrap}
.pill.hot{background:var(--pink); color:var(--ink); border-color:transparent}
.iconbtn{font:700 .85rem var(--body); color:var(--text); background:var(--glass); border:1px solid var(--edge); border-radius:999px; padding:6px 12px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; min-height:38px}
.iconbtn:hover{background:var(--glass2)}
.iconbtn svg{width:18px; height:18px; display:block}
.banner{background:rgba(255,122,136,.18); color:var(--text); border:1px solid rgba(255,122,136,.55); border-radius:14px; padding:10px 12px; font-weight:700; font-size:.92rem}

/* botones */
.btn{
  position:relative; overflow:hidden;
  font-family:var(--display); font-size:1.3rem; line-height:1.1; letter-spacing:.01em;
  border:0; border-radius:999px; padding:16px 22px 15px; width:100%;
  background:linear-gradient(180deg,#FFE08A 0%,var(--gold) 45%,var(--gold2) 100%); color:var(--ink); cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 4px 0 #B0650F, 0 14px 30px -10px rgba(255,203,76,.65);
  transition:transform .08s, box-shadow .08s;
}
.btn::after{content:""; position:absolute; top:0; bottom:0; width:40%; left:-60%; background:linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); transform:skewX(-18deg)}
@media (hover:hover){ .btn:not([disabled]):hover::after{animation:shine .7s ease-out} }
.btn:active{transform:translateY(3px); box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 1px 0 #B0650F, 0 8px 20px -10px rgba(255,203,76,.65)}
.btn[disabled]{opacity:.4; cursor:not-allowed; transform:none; filter:saturate(.4)}
.btn.ghost{background:var(--glass); color:var(--text); font:800 1.05rem var(--body); box-shadow:inset 0 0 0 1.5px var(--edge)}
.btn.ghost:active{transform:translateY(2px)}
.btn.yellow{background:linear-gradient(180deg,#FF9CC8,var(--pink)); color:var(--ink); box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 4px 0 #A82D66, 0 14px 30px -10px rgba(255,95,162,.6)}
.link{background:none; border:0; color:var(--text); text-decoration:underline; text-decoration-color:var(--gold); text-decoration-thickness:2px; text-underline-offset:4px; font:700 .95rem var(--body); padding:8px; cursor:pointer; align-self:center}
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible{outline:3px solid var(--gold); outline-offset:3px}

/* portada */
.hero{display:flex; flex-direction:column; align-items:center; text-align:center; gap:16px; padding-top:22px}
.logo{display:flex; flex-direction:column; align-items:center; line-height:.95; position:relative}
.logo span:first-child{font-family:var(--display); font-size:clamp(2rem, 9vw, 2.7rem); color:var(--pink); transform:rotate(-5deg) translateX(-18%); text-shadow:0 0 24px rgba(255,95,162,.55)}
.logo span:last-child{font-family:var(--display); font-size:clamp(3rem, 15vw, 4.7rem); background:var(--goldtext); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 4px 0 rgba(0,0,0,.35)) drop-shadow(0 0 22px rgba(255,203,76,.35))}
.logo::after{content:"✦"; position:absolute; right:-14px; top:-6px; color:var(--gold); font-size:1.6rem; animation:sparkle 2.4s ease-in-out infinite}
.lede{font-size:1.1rem; max-width:34ch; color:var(--text)}
.scale{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; width:100%}
.scale > div{background:var(--glass); border:1px solid var(--edge); border-radius:14px; padding:8px 2px 9px; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:0; border-top:4px solid var(--hc)}
.scale b{display:block; font-family:var(--display); font-weight:400; font-size:1.5rem; line-height:1; color:var(--hc)}
.scale small{font-size:.66rem; font-weight:700; color:var(--soft); line-height:1.1; text-align:center}
.meta{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
.meta span{font-size:.8rem; font-weight:700; color:var(--soft); background:var(--glass); border:1px solid var(--edge); border-radius:999px; padding:4px 11px}
.modes{display:grid; gap:12px}
.mode{display:grid; grid-template-columns:auto 1fr; gap:2px 14px; align-items:center; text-align:left; background:var(--glass); color:var(--text); border:1px solid var(--edge); border-radius:22px; padding:15px 16px; cursor:pointer; font:inherit; transition:transform .12s, background .12s}
.mode:hover{background:var(--glass2)}
.mode:active{transform:scale(.98)}
.mode.main{border:2px solid transparent; background:linear-gradient(var(--night2),var(--night2)) padding-box, linear-gradient(135deg,var(--gold),var(--pink)) border-box; box-shadow:0 14px 34px -16px rgba(255,95,162,.7)}
.mode svg{grid-row:span 2; width:46px; height:46px}
.mode b{font-family:var(--display); font-weight:400; font-size:1.25rem; line-height:1.15}
.mode small{font-size:.9rem; color:var(--soft)}
.mode[disabled]{opacity:.5; cursor:not-allowed}
details.box{background:var(--glass); border:1px solid var(--edge); border-radius:18px; padding:4px 16px}
details.box summary{cursor:pointer; font-weight:800; padding:12px 0; list-style-position:inside}
details.box[open]{padding-bottom:16px}
.rules{margin:0; padding-left:1.3em; display:flex; flex-direction:column; gap:8px}
.rules li::marker{color:var(--gold); font-family:var(--display)}

/* armado */
.plist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
.plist li{display:flex; align-items:center; gap:10px; background:var(--glass); border:1px solid var(--edge); border-radius:16px; padding:6px 6px 6px 14px; min-height:54px}
.plist .tag{font-size:.75rem; font-weight:700; color:var(--soft); margin-left:auto; padding-right:8px}
.plist .nm{font-weight:800; font-size:1.05rem; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dot{width:16px; height:16px; border-radius:50%; background:var(--pc); box-shadow:0 0 0 2px var(--night), 0 0 12px var(--pc); flex:none}
.plist input{flex:1; min-width:0; background:transparent; border:0; color:var(--text); font:700 1.08rem var(--body); padding:10px 4px}
.plist input::placeholder{color:var(--soft); opacity:.6}
.rm{background:transparent; border:0; color:var(--soft); font:700 1.5rem var(--body); width:40px; height:40px; border-radius:12px; cursor:pointer}
.rm:hover{background:var(--glass2); color:var(--text)}
.rm[disabled]{opacity:.2}
.stepper{display:flex; align-items:center; gap:14px; background:var(--glass); border:1px solid var(--edge); border-radius:18px; padding:10px 12px}
.stepper button{width:46px; height:46px; border-radius:50%; border:0; background:linear-gradient(180deg,#FFE08A,var(--gold2)); color:var(--ink); font:400 1.5rem var(--display); cursor:pointer; box-shadow:0 3px 0 #B0650F}
.stepper button:active{transform:translateY(2px); box-shadow:0 1px 0 #B0650F}
.stepper button[disabled]{opacity:.3}
.stepper b{font-family:var(--display); font-weight:400; font-size:2rem; min-width:1.4em; text-align:center; font-variant-numeric:tabular-nums; color:var(--gold)}
.stepper p{flex:1; color:var(--soft); font-size:.92rem}
.stepper p strong{color:var(--text)}
.decks{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.deck{text-align:left; background:var(--glass); color:var(--text); border:1px solid var(--edge); border-radius:16px; padding:10px; cursor:pointer; font:inherit; display:grid; grid-template-columns:auto 1fr; gap:2px 10px; align-items:center; min-width:0; opacity:.5; transition:opacity .15s, transform .15s}
.deck .dicon{grid-row:span 2; width:38px; height:38px; display:block}
.deck b{font-weight:800; font-size:.95rem; line-height:1.15}
.deck small{color:var(--soft); font-size:.74rem; line-height:1.2}
.deck.on{opacity:1; border:1.5px solid transparent; background:linear-gradient(var(--night2),var(--night2)) padding-box, linear-gradient(135deg,var(--gold),var(--pink)) border-box}
.deck[disabled]{cursor:default}
.switch{display:flex; align-items:center; gap:12px; background:var(--glass); border:1px solid var(--edge); border-radius:16px; padding:12px 14px; color:var(--text); font:inherit; text-align:left; cursor:pointer; width:100%}
.switch[disabled]{cursor:default}
.switch span{flex:1; min-width:0}
.switch b{display:block; font-weight:800}
.switch small{color:var(--soft); font-size:.85rem}
.knob{flex:none; width:52px; height:30px; border-radius:15px; background:rgba(255,255,255,.16); position:relative; transition:background .15s}
.knob::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:var(--text); transition:transform .2s cubic-bezier(.2,1.4,.4,1)}
.switch[aria-checked="true"] .knob{background:var(--mint)}
.switch[aria-checked="true"] .knob::after{transform:translateX(22px); background:var(--ink)}
textarea, .field{width:100%; background:rgba(0,0,0,.25); border:1px solid var(--edge); border-radius:14px; color:var(--text); font:600 1rem/1.4 var(--body); padding:12px}
textarea::placeholder, .field::placeholder{color:var(--soft); opacity:.6}
textarea{min-height:110px; resize:vertical}
.field.code{font:400 2rem var(--display); letter-spacing:.3em; text-transform:uppercase; text-align:center; padding:10px; color:var(--gold)}
.or{display:flex; align-items:center; gap:10px; color:var(--soft); font-size:.95rem; font-family:var(--display)}
.or::before,.or::after{content:""; flex:1; height:1px; background:var(--edge)}

/* sala */
.codebox{background:var(--glass); border:1.5px solid rgba(255,203,76,.45); border-radius:24px; padding:18px; text-align:center; display:flex; flex-direction:column; gap:8px; align-items:center; box-shadow:0 0 40px -12px rgba(255,203,76,.4)}
.codebox .code{font-family:var(--display); font-size:3.6rem; letter-spacing:.16em; line-height:1.1; padding-left:.16em; background:var(--goldtext); -webkit-background-clip:text; background-clip:text; color:transparent}
.invite{display:grid; grid-template-columns:1fr; gap:8px; width:100%}

/* tragamonedas */
.vname{background:none !important; color:var(--pc) !important; text-shadow:0 0 28px var(--pc)}
.slot{position:relative; width:min(100%, 340px); margin:4px auto 2px; padding:12px 14px 16px; border-radius:30px;
  background:linear-gradient(180deg,#3E1C73,#220E45); box-shadow:inset 0 0 0 2px rgba(255,203,76,.6), inset 0 2px 0 rgba(255,255,255,.2), 0 24px 50px -22px rgba(255,95,162,.7)}
.lights{display:flex; justify-content:space-between; padding:0 8px 10px}
.lights i{width:9px; height:9px; border-radius:50%; background:var(--gold); box-shadow:0 0 10px var(--gold); animation:blink 1.4s ease-in-out infinite; animation-delay:calc(var(--i) * .15s)}
.reel-win{position:relative; height:calc(var(--rh) * 3); overflow:hidden; border-radius:18px; background:var(--paper)}
.reel-win::before{content:""; position:absolute; inset:0; z-index:2; pointer-events:none; background:linear-gradient(180deg, rgba(30,15,51,.6), rgba(30,15,51,0) 32%, rgba(30,15,51,0) 68%, rgba(30,15,51,.6))}
.reel-win::after{content:""; position:absolute; left:6px; right:6px; top:var(--rh); height:var(--rh); z-index:3; pointer-events:none; border:2.5px solid var(--gold2); border-radius:14px; box-shadow:0 0 18px rgba(245,158,43,.55)}
.reel{will-change:transform}
.ri{height:var(--rh); display:flex; align-items:center; gap:14px; padding:0 20px; color:var(--ink)}
.ri b{flex:none; width:52px; height:52px; border-radius:14px; background:var(--mc); display:grid; place-items:center; font-family:var(--display); font-weight:400; font-size:1.2rem; color:var(--ink); box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.ri span{font-weight:800; font-size:1.12rem; min-width:0}
.modbox{display:flex; gap:14px; align-items:center; background:var(--glass); border:1px solid var(--edge); border-radius:20px; padding:14px; text-align:left}
.modsym{flex:none; width:58px; height:58px; border-radius:16px; display:grid; place-items:center; background:var(--mc); color:var(--ink); font-family:var(--display); font-size:1.4rem; box-shadow:inset 0 -3px 0 rgba(0,0,0,.15), 0 0 22px -4px var(--mc)}
.modbox strong{font-family:var(--display); font-weight:400; font-size:1.3rem; display:block}
.modbox p{color:var(--soft); font-size:.95rem}
.modbox.pop{animation:bounceIn .5s cubic-bezier(.2,1.5,.4,1)}
.modtag{display:inline-flex; align-items:center; gap:8px; font-size:.85rem; font-weight:700; color:var(--text); text-transform:none; letter-spacing:0}
.modtag i{font-style:normal; font-family:var(--display); background:var(--mc); color:var(--ink); border-radius:8px; padding:1px 8px}

/* boletos */
.cards{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px}
.cards > li{filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
.card{
  position:relative; background:linear-gradient(180deg,var(--paper),var(--paper2)); color:var(--ink);
  border-radius:16px; padding:14px 16px; display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:start;
  -webkit-mask:radial-gradient(circle 9px at left 50%, #0000 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle 9px at right 50%, #0000 97%, #000) right / 51% 100% no-repeat;
  mask:radial-gradient(circle 9px at left 50%, #0000 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle 9px at right 50%, #0000 97%, #000) right / 51% 100% no-repeat;
}
.card:not(.rank)::before{content:""; position:absolute; top:12px; bottom:12px; left:63px; border-left:2px dashed rgba(110,92,140,.35)}
.letter{width:38px; height:38px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #FFF0B8, var(--gold) 55%, var(--gold2)); color:var(--ink); display:grid; place-items:center; font-family:var(--display); font-size:1.1rem; box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.card p{font-weight:700; font-size:1.08rem; line-height:1.28; padding-top:6px; min-width:0}
.swap{background:rgba(30,15,51,.07); border:1px solid rgba(30,15,51,.2); color:var(--ink); border-radius:999px; font:700 .78rem var(--body); padding:6px 11px; cursor:pointer}
.swap:hover{background:rgba(30,15,51,.13)}
.card.rank, .card.big{grid-template-columns:auto 1fr}
.card.big::before{left:62px}
.card .chips{grid-column:1 / -1}
.card.big{animation:flipIn .5s cubic-bezier(.2,1.2,.4,1) both; transform-origin:center; padding-block:20px}
.card.big p{font-size:1.4rem; padding-top:2px}

/* fichas 1 a 5 */
.h1{--hc:var(--h1)} .h2{--hc:var(--h2)} .h3{--hc:var(--h3)} .h4{--hc:var(--h4)} .h5{--hc:var(--h5)}
.chips{display:grid; grid-template-columns:repeat(5, 1fr); gap:6px}
.chip{position:relative; overflow:hidden; border:1.5px solid rgba(30,15,51,.14); background:#fff; color:var(--ink); border-radius:14px; padding:7px 2px 10px; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; min-width:0; font-family:var(--body); transition:transform .12s}
.chip::after{content:""; position:absolute; left:0; right:0; bottom:0; height:5px; background:var(--hc)}
.chip b{font-family:var(--display); font-weight:400; font-size:1.45rem; line-height:1}
.chip small{font-size:.6rem; font-weight:800; line-height:1.05; text-align:center}
.chip.on{background:var(--hc); border-color:transparent; transform:translateY(-3px); box-shadow:0 8px 16px -6px var(--hc)}
.chip.on.just{animation:chipPop .3s cubic-bezier(.2,1.8,.4,1)}
.chip.used{opacity:.3}
.tok{display:inline-grid; place-items:center; width:40px; height:40px; border-radius:50%; background:var(--hc); color:var(--ink); font-family:var(--display); font-size:1.2rem; flex:none}
.tok.lg{width:84px; height:84px; font-size:2.8rem; box-shadow:0 0 0 5px rgba(255,255,255,.12), 0 0 34px var(--hc); animation:flipIn .55s .15s cubic-bezier(.2,1.4,.4,1) both}

/* pasar el celu */

let actx = null;
function ac(){
  if(muted) return null;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    return actx;
  }catch(e){ return null; }
}
function tone(freq, dur, type='sine', vol=.2, when=0, slideTo=0){
  const a = ac(); if(!a) return;
  try{
    const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.012); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.03);
  }catch(e){}
}

/* ================= motor del juego ================= */
function buildPool(decks, custom){
  let p = [];
  DECKS.forEach(d=>{ if(decks.includes(d.id)) p = p.concat(d.cards); });
  String(custom||'').split('\n').map(s=>s.trim().slice(0,90)).filter(Boolean).slice(0,200).forEach(c=>p.push(c));
  return [...new Set(p)];
}
function draw(){ if(!H.deck.length) H.deck = shuffle(H.pool); return H.deck.pop(); }
function startGame(mode, players, s, code, hostId){
  const pool = buildPool(s.decks, draft.custom);
  const acts = (H && H.acts) || {};
  G = {v:2, gid:rid(), mode, code:code||null, hostId:hostId||null, settings:{...s},
       teams:!!s.teams, defendOn:!!s.defend, players, totalRounds:players.length*s.turns,
       round:1, victim:0, reel:0, stats:null};
  H = {pool, deck:shuffle(pool), log:[], acts};
  newRound();
}
function newRound(){
  Object.assign(G, {phase:'spin', mod:null, spin:null, cards:[], rankings:{}, turn:0, reveal:0, defend:null, result:null});
}
function validRank(r){ return Array.isArray(r) && r.length===5 && [1,2,3,4,5].every(n=>r.includes(n)); }
/* Con 2 equipos la partida solo termina cuando los dos adivinaron la misma cantidad de veces. */
function gameOver(){ return G.round>=G.totalRounds && leaders().length===1 && (!duo() || G.round%2===0); }
function leaders(){ const mx = Math.max(...G.players.map(p=>p.score)); return G.players.filter(p=>p.score===mx).map(p=>p.id); }

function computeRound(){
  const vid = vic().id, truth = G.rankings[vid], m = G.mod, res = {};
  let best = 0;
  G.players.forEach(p=>{
    if(p.id===vid) return;
    const g = G.rankings[p.id] || [0,0,0,0,0], hits = [];
    for(let k=0;k<5;k++) if(g[k]===truth[k]) hits.push(truth[k]);
    const n = hits.length, ac = n===1 ? '1 acierto' : n+' aciertos';
    let total = n, note = ac;
    if(m==='sum'){ total = hits.reduce((a,b)=>a+b,0); note = n ? ac+' · '+hits.slice().sort().join(' + ') : ac; }
    else if(m==='double'){ total = n*2; note = ac+' × 2'; }
    else if(m==='triple'){ total = n*3; note = ac+' × 3'; }
    else if(m==='four' && hits.includes(4)){ total = n+4; note = ac+' + 4 por el 4'; }
    else if(m==='one' && hits.includes(1)){ total = n+1; note = ac+' + 1 por el 1'; }
    else if(m==='all' && n===5){ total = n+5; note = ac+' + 5 por el pleno'; }
    res[p.id] = {hits:n, total, note};
    best = Math.max(best, total);
  });
  res[vid] = duo() ? {victim:true, total:0, note:'Estrella: con 2 equipos no suma'} : {victim:true, total:best, note:'Estrella: igual al mejor de la ronda'};
  return res;
}
function scoreRound(){
  const res = computeRound(), vid = vic().id;
  G.result = res;
  G.players.forEach(p=>{ p.score += res[p.id].total; });
  const pts = {}; G.players.forEach(p=>pts[p.id]=res[p.id].total);
  H.log.push({v:vid, mod:G.mod, cards:G.cards.slice(), r:JSON.parse(JSON.stringify(G.rankings)), pts});
  G.phase = 'score';
}
function computeStats(){
  const log = H.log, nm = id => (pById(id)||{}).name || '?', out = [];
  const pair = {}, guess = {}, read = {};
  log.forEach(e=>{
    const t = e.r[e.v]; if(!t) return;
    G.players.forEach(p=>{
      const g = e.r[p.id]; if(p.id===e.v || !validRank(g)) return;
      const h = g.filter((x,k)=>x===t[k]).length, key = p.id+'>'+e.v;
      pair[key] = pair[key] || {g:p.id, v:e.v, h:0, n:0}; pair[key].h += h; pair[key].n += 5;
      guess[p.id] = guess[p.id] || {h:0, n:0, plenos:0}; guess[p.id].h += h; guess[p.id].n += 5; if(h===5) guess[p.id].plenos++;
      read[e.v] = read[e.v] || {h:0, n:0}; read[e.v].h += h; read[e.v].n += 5;
    });
  });
  const pct = o => o.h/o.n;
  const pairs = Object.values(pair);
  if(pairs.length){
    const best = pairs.reduce((a,b)=> pct(b)>pct(a) || (pct(b)===pct(a) && b.n>a.n) ? b : a);
    out.push({t:'Se conocen de memoria', b:nm(best.g)+' → '+nm(best.v), d:`Le acertó ${best.h} de ${best.n} cartas.`});
    const worst = pairs.reduce((a,b)=> pct(b)<pct(a) || (pct(b)===pct(a) && b.n>a.n) ? b : a);
    if(worst!==best && pct(worst)<pct(best)) out.push({t:'Ni idea', b:nm(worst.g)+' → '+nm(worst.v), d:`Le acertó ${worst.h} de ${worst.n}. ¿Se conocen?`});
  }
  const gs = Object.entries(guess);
  if(gs.length){
    const [id,g] = gs.reduce((a,b)=> pct(b[1])>pct(a[1]) ? b : a);
    out.push({t:'Mejor adivino', b:nm(id), d:`Acertó el ${Math.round(pct(g)*100)}% cuando no era la estrella.`});
  }
  const rs = Object.entries(read);
  if(rs.length>1){
    const [id,r] = rs.reduce((a,b)=> pct(b[1])<pct(a[1]) ? b : a);
    out.push({t:'Imposible de leer', b:nm(id), d:`Como estrella, los demás le acertaron solo el ${Math.round(pct(r)*100)}%.`});
    const [id2,r2] = rs.reduce((a,b)=> pct(b[1])>pct(a[1]) ? b : a);
    if(id2!==id) out.push({t:'Libro abierto', b:nm(id2), d:`Como estrella, los demás le acertaron el ${Math.round(pct(r2)*100)}%.`});
  }
  const pl = gs.filter(([,g])=>g.plenos>0).sort((a,b)=>b[1].plenos-a[1].plenos);
  if(pl.length) out.push({t:'Plenos', b:pl.slice(0,3).map(([id,g])=>nm(id)+' ×'+g.plenos).join(' · '), d:'Acertaron las cinco cartas en una ronda.'});
  let br = null;
  log.forEach((e,i)=>Object.entries(e.pts).forEach(([id,p])=>{ if(id!==e.v && (!br || p>br.p)) br = {id, p, mod:e.mod, i}; }));
  if(br && br.p>0) out.push({t:'Mejor ronda', b:nm(br.id)+' +'+br.p, d:`En la ronda ${br.i+1}, con ${mod(br.mod).name}.`});
  let hot = null, calm = null;
  log.forEach(e=>e.cards.forEach((c,k)=>{
    const vals = Object.values(e.r).map(r=>r[k]).filter(x=>x>0); if(vals.length<3) return;
    const m = vals.reduce((a,b)=>a+b,0)/vals.length, v = vals.reduce((a,b)=>a+(b-m)**2,0)/vals.length;
    const it = {c:c.slice(0,90), v, m, min:Math.min(...vals), max:Math.max(...vals)};
    if(!hot || v>hot.v) hot = it;
    if(!calm || v<calm.v || (v===calm.v && m>calm.m)) calm = it;
  }));
  if(hot && hot.v>0) out.push({wide:1, t:'El que más dividió', b:hot.c, d:`Lo pusieron desde ${hot.min} (${WORD[hot.min].toLowerCase()}) hasta ${hot.max} (${WORD[hot.max].toLowerCase()}).`});
  if(calm && calm!==hot) out.push({wide:1, t:'Todos de acuerdo', b:calm.c, d:`Promedio ${calm.m.toFixed(1).replace('.',',')}: ${WORD[Math.round(calm.m)].toLowerCase()} para casi todos.`});
  return out;
}

/* Todas las jugadas pasan por acá. En modo online solo corre en el celular del anfitrión. */
function apply(type, arg, actor){
  if(!G) return false;
  arg = arg || {};
  const on = G.mode==='online';
  const hostish = !on || actor===G.hostId;
  const FLOW = {spin:1,toCards:1,swap:1,startRank:1,reveal:1,nextReveal:1,defend:1,nextRound:1,final:1};
  if(on && FLOW[type] && !hostish && G.players[G.victim] && actor!==vic().id) return false;
  switch(type){
    case 'start':
      if(!hostish || G.phase!=='lobby' || G.players.length<minPlayers(G.settings.teams)) return false;
      startGame('online', G.players.map(p=>({...p, score:0})), G.settings, G.code, G.hostId); return true;
    case 'spin': {
      if(G.phase!=='spin' || G.mod) return false;
      const i = Math.floor(Math.random()*MODS.length);
      G.spin = {id:rid(), i}; G.mod = MODS[i].id; return true;
    }
    case 'toCards': {
      if(G.phase!=='spin' || !G.mod) return false;
      G.cards = []; let t = 0;
      while(G.cards.length<5 && t++<60){ const c = draw(); if(!G.cards.includes(c)) G.cards.push(c); }
      G.phase = 'cards'; return true;
    }
    case 'swap': {
      const k = arg.k|0; if(G.phase!=='cards' || k<0 || k>4) return false;
      let c = draw(), t = 0; while(G.cards.includes(c) && t++<8) c = draw();
      G.cards[k] = c; return true;
    }
    case 'startRank':
      if(G.phase!=='cards') return false;
      G.turn = 0; G.rankings = {}; G.phase = on ? 'rank' : 'handoff'; return true;
    case 'submitRank': {
      const id = arg.id, r = arg.r;
      if(!pById(id) || !validRank(r)) return false;
      if(on){
        if(actor!==id || G.phase!=='rank' || G.rankings[id]) return false;
        G.rankings[id] = r.slice();
        if(G.players.every(p=>G.rankings[p.id])) G.phase = 'ready';
        return true;
      }
      if(G.phase!=='rank') return false;
      G.rankings[id] = r.slice(); G.turn++;
      G.phase = G.turn < G.players.length ? 'handoff' : 'ready'; return true;
    }
    case 'skipMissing': {
      const vid = vic().id;
      if(!on || !hostish || G.phase!=='rank' || !G.rankings[vid]) return false;
      G.players.forEach(p=>{ if(!G.rankings[p.id]) G.rankings[p.id] = [0,0,0,0,0]; });
      G.phase = 'ready'; return true;
    }
    case 'reveal':
      if(G.phase!=='ready') return false;
      G.phase = 'reveal'; G.reveal = 0; G.defend = null; return true;
    case 'defend':
      if(G.phase!=='reveal' || !G.defendOn) return false;
      G.defend = {id:rid(), k:G.reveal}; return true;
    case 'nextReveal':
      if(G.phase!=='reveal' || (arg.at!==undefined && arg.at!==G.reveal)) return false;
      if(G.reveal<4){ G.reveal++; G.defend = null; return true; }
      scoreRound(); return true;
    case 'nextRound': {
      if(G.phase!=='score' || (arg.at!==undefined && arg.at!==G.round)) return false;
      if(gameOver()) return false;
      if(G.spin) G.reel = G.spin.i;
      G.round++; G.victim = (G.victim+1) % G.players.length; newRound(); return true;
    }
    case 'final':
      if(G.phase!=='score' || !gameOver()) return false;
      G.stats = computeStats(); G.phase = 'final'; return true;
    case 'again':
      if(!hostish || G.phase!=='final') return false;
      startGame(G.mode, G.players.map(p=>({...p, score:0})), G.settings, G.code, G.hostId); return true;
  }
  return false;
}
function dispatch(type, arg){
  if(!G) return;
  if(iAmHost()){
    if(apply(type, arg, online() ? me.pid : null)) commit(); else render();
  } else {
    sendAct(type, arg); render();
  }
}
function commit(){
  save();
  if(online() && net.isHost) publishHost();
  render();
}

/* ================= red (cada uno con su celular) ================= */
function bytes(s){ try{ return new TextEncoder().encode(s).length }catch(e){ return s.length*2 } }
function pubState(){
  const g = JSON.parse(JSON.stringify(G));
  if(g.phase==='rank'){ g.done = Object.keys(g.rankings); g.rankings = {}; }
  if(bytes(JSON.stringify(g)) > 3600 && g.result) Object.values(g.result).forEach(r=>{ r.note = ''; });
  while(bytes(JSON.stringify(g)) > 3600 && g.stats && g.stats.length) g.stats.pop();
  return g;
}
function publishHost(){
  if(!net.nr) return;
  net.nr.presence({code:net.code, pid:me.pid, name:me.name, host:true, g:pubState()}).catch(()=>{});
}
function sendAct(type, arg){
  if(!net.nr) return;
  net.actSeq++;
  net.nr.presence({act:{id:me.pid.slice(-5)+Date.now().toString(36)+net.actSeq, type, arg:arg||{}}}).catch(()=>{});
}
/* Dentro de Claude se usa la sala de Claude. En cualquier otra web, los celulares se conectan
   directo entre sí (WebRTC con PeerJS): el anfitrión es el centro y los demás se conectan a él. */
const IN_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');
const sleep = ms => new Promise(r=>setTimeout(r,ms));
let peerLibP = null;
function loadPeerLib(){
  if(window.Peer) return Promise.resolve();
  if(!peerLibP) peerLibP = new Promise((res, rej)=>{
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
    s.onload = ()=> window.Peer ? res() : rej({type:'lib'});
    s.onerror = ()=>{ peerLibP = null; rej({type:'lib'}); };
    document.head.appendChild(s);
  });
  return peerLibP;
}
async function p2pRoom(code, asHost, reopen){
  await loadPeerLib();
  const hostId = 'mejor-imposible-' + code.toLowerCase();
  const others = new Map(), conns = new Map(), subs = [];
  let mine = {}, snap = Object.freeze([]), closed = false, peer = null, conn = null, retry = null, connect = ()=>{};
  const fire = () => {
    snap = Object.freeze([{peer:'yo', isMe:true, sameTab:true, kind:'viewer', guest:false, by:null, presence:mine},
      ...[...others].map(([id, presence])=>({peer:id, isMe:false, sameTab:false, kind:'viewer', guest:false, by:null, presence}))]);
    subs.forEach(f=>{ try{ f({peers:snap, joined:[], left:[], updated:[]}); }catch(e){} });
  };
  const sendTo = c => { try{ if(c && c.open) c.send({t:'p', p:mine}); }catch(e){} };
  const newPeer = () => new Promise((res, rej)=>{
    const p = asHost ? new window.Peer(hostId, {debug:0}) : new window.Peer({debug:0});
    let done = false;
    const to = setTimeout(()=>{ if(!done){ done = true; try{ p.destroy(); }catch(e){} rej({type:'timeout'}); } }, 15000);
    p.on('open', ()=>{ if(!done){ done = true; clearTimeout(to); res(p); } });
    p.on('error', e=>{ if(!done){ done = true; clearTimeout(to); try{ p.destroy(); }catch(x){} rej(e || {type:'error'}); } });
  });
  for(let i=0;;i++){
    try{ peer = await newPeer(); break; }
    catch(e){
      // Si el anfitrión recarga la página, su código tarda unos segundos en liberarse.
      if(asHost && reopen && e && e.type==='unavailable-id' && i<6){ await sleep(4000); continue; }
      throw e;
    }
  }
  peer.on('disconnected', ()=>{ if(!closed) setTimeout(()=>{ try{ if(!closed && peer.disconnected) peer.reconnect(); }catch(e){} }, 1500); });
  if(asHost){
    peer.on('connection', c=>{
      c.on('open', ()=>{ conns.set(c.peer, c); sendTo(c); });
      c.on('data', d=>{ if(d && d.t==='p' && d.p && typeof d.p==='object'){ others.set(c.peer, d.p); fire(); } });
      const drop = ()=>{ if(conns.get(c.peer)===c) conns.delete(c.peer); if(others.delete(c.peer)) fire(); };
      c.on('close', drop); c.on('error', drop);
    });
    peer.on('error', ()=>{});
  } else {
    const lost = ()=>{ if(closed) return; if(others.delete('anfitrion')) fire(); clearTimeout(retry); retry = setTimeout(connect, 2500); };
    connect = ()=>{
      if(closed) return;
      const old = conn;
      const c = peer.connect(hostId, {reliable:true}); conn = c;
      try{ old && old.close(); }catch(e){}
      c.on('open', ()=>sendTo(c));
      c.on('data', d=>{ if(c===conn && d && d.t==='p' && d.p && typeof d.p==='object'){ others.set('anfitrion', d.p); fire(); } });
      c.on('close', ()=>{ if(c===conn) lost(); });
      c.on('error', ()=>{ if(c===conn) lost(); });
    };
    peer.on('error', e=>{ if(e && e.type==='peer-unavailable') lost(); });
    connect();
  }
  const onVisible = ()=>{
    if(document.visibilityState!=='visible' || closed) return;
    try{ if(peer.disconnected) peer.reconnect(); }catch(e){}
    if(!asHost && !(conn && conn.open)){ clearTimeout(retry); connect(); }
  };
  document.addEventListener('visibilitychange', onVisible);
  fire();
  return {
    presence: async patch => {
      const m = {...mine};
      for(const k in patch){ if(patch[k]===null) delete m[k]; else m[k] = patch[k]; }
      mine = JSON.parse(JSON.stringify(m));
      if(asHost) conns.forEach(sendTo); else sendTo(conn);
      fire();
    },
    peers: () => snap,
    onPeers: f => { subs.push(f); setTimeout(()=>f({peers:snap, joined:[], left:[], updated:[]}), 0); return ()=>{ const i = subs.indexOf(f); if(i>=0) subs.splice(i,1); }; },
    leave: async () => {
      closed = true; clearTimeout(retry); document.removeEventListener('visibilitychange', onVisible);
      try{ conns.forEach(c=>c.close()); conn && conn.close(); }catch(e){}
      try{ peer.destroy(); }catch(e){}
    },
    connected: () => !closed && !!peer && !peer.disconnected,
  };
}
async function getRoom(){
  if(net.room !== undefined) return net.room;
  if(!IN_CLAUDE){ net.room = {p2p:true}; return net.room; }
  try{ net.room = await window.claude.use('room'); }catch(e){ net.room = null; }
  return net.room;
}
async function openRoom(code, asHost, reopen){
  const room = await getRoom(); if(!room) throw {type:'no-room'};
  if(room.p2p) return p2pRoom(code, asHost, reopen);
  try{ return await room.join('mi-' + code.toLowerCase()); }catch(e){ return room; }
}
function netErrorText(e){
  if(e && e.type==='lib') return 'No se pudo cargar la conexión. Revisá que tengas internet.';
  if(e && e.type==='unavailable-id') return 'Esa sala ya está abierta en otro celular.';
  if(e && e.type==='browser-incompatible') return 'Este navegador no permite conectar celulares. Probá con Chrome o Safari actualizados.';
  return 'No se pudo conectar. Revisá internet y probá de nuevo.';
}
function newCode(){ const L='ABCDEFGHJKLMNPQRSTUVWXYZ'; let c=''; for(let i=0;i<4;i++) c+=L[Math.floor(Math.random()*L.length)]; return c; }
function inviteURL(){ return location.origin + location.pathname + '#' + (G && G.code || net.code || ''); }
function toast(msg){
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role','status'); el.textContent = msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(), 2400);
}
function copyText(t){
  try{ navigator.clipboard.writeText(t).then(()=>toast('Enlace copiado'), ()=>toast(t)); }catch(e){ toast(t); }
}
function peerList(){
  try{ return net.nr.peers().filter(p=>p.presence && p.presence.code===net.code && typeof p.presence.pid==='string'); }catch(e){ return []; }
}
async function hostRoom(code, fresh){
  net.err = ''; net.busy = true; render();
  for(let i=0;;i++){
    try{ net.nr = await openRoom(code, true, !fresh); break; }
    catch(e){
      if(fresh && e && e.type==='unavailable-id' && i<3){ code = newCode(); continue; }
      net.busy = false; net.err = netErrorText(e); render(); return;
    }
  }
  net.busy = false;
  net.code = code; net.isHost = true; savedJoin = null;
  if(fresh){
    G = {v:2, mode:'online', phase:'lobby', code, hostId:me.pid,
         settings:{decks:draft.decks.slice(), turns:defaultTurns(3), touched:false, teams:draft.teams, defend:draft.defend},
         players:[{id:me.pid, name:me.name, color:PCOL[0], score:0}]};
    H = {pool:[], deck:[], log:[], acts:{}};
  }
  net.unsub && net.unsub();
  net.unsub = net.nr.onPeers(hostSync, ()=>{});
  view = 'game'; keepAwake(); commit();
}
function hostSync(){
  if(!G || !net.isHost) return;
  let changed = false;
  const peers = peerList().filter(p=>!p.presence.host && p.presence.pid!==me.pid);
  if(G.phase==='lobby'){
    const list = [G.players[0]];
    peers.forEach(p=>{
      const pid = p.presence.pid;
      if(list.length<MAXP && !list.some(x=>x.id===pid)) list.push({id:pid, name:cleanName(p.presence.name)||'Sin nombre', color:PCOL[list.length], score:0});
    });
    if(JSON.stringify(list)!==JSON.stringify(G.players)){
      G.players = list;
      if(!G.settings.touched) G.settings.turns = defaultTurns(Math.max(minPlayers(G.settings.teams),list.length));
      changed = true;
    }
  }
  peers.forEach(p=>{
    const pr = p.presence, pl = pById(pr.pid); if(!pl) return;
    if(pr.rank && pr.rank.gid===G.gid && pr.rank.round===G.round && G.phase==='rank' && !G.rankings[pl.id]){
      if(apply('submitRank', {id:pl.id, r:pr.rank.r}, pl.id)) changed = true;
    }
    if(pr.act && typeof pr.act.id==='string' && H.acts[pl.id]!==pr.act.id){
      H.acts[pl.id] = pr.act.id;
      if(apply(String(pr.act.type), pr.act.arg, pl.id)) changed = true;
      save();
    }
  });
  if(changed) commit(); else render();
}
async function joinRoom(code){
  net.err = '';
  code = String(code||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
  if(code.length!==4){ net.err = 'El código tiene 4 letras.'; render(); return; }
  if(!me.name){ net.err = 'Poné tu nombre primero.'; render(); return; }
  net.busy = true; render();
  try{ net.nr = await openRoom(code, false); }
  catch(e){ net.busy = false; net.err = netErrorText(e); render(); return; }
  net.busy = false; net.prefill = '';
  try{ if(!IN_CLAUDE && location.hash) history.replaceState(null, '', location.pathname); }catch(e){}
  net.code = code; net.isHost = false; net.hostSeen = false; net.hostLost = false; net.lastG = null;
  G = null; H = null; savedJoin = {code};
  net.nr.presence({code, pid:me.pid, name:me.name, host:null, g:null}).catch(()=>{});
  net.unsub && net.unsub();
  net.unsub = net.nr.onPeers(clientSync, ()=>{});
  view = 'game'; keepAwake(); save(); render();
  clearTimeout(net.timer);
  net.timer = setTimeout(()=>{ if(!net.hostSeen && !net.isHost && view==='game'){ net.err = `No encontramos la sala ${code}. Revisá el código o pedile al anfitrión que la abra.`; render(); } }, 9000);
}
function clientSync(){
  if(net.isHost) return;
  const host = peerList().find(p=>p.presence.host===true && p.presence.g);
  if(host){
    net.hostSeen = true; net.hostLost = false; net.err = '';
    if(host.presence.g !== net.lastG){ net.lastG = host.presence.g; G = JSON.parse(JSON.stringify(host.presence.g)); }
  } else if(net.hostSeen){ net.hostLost = true; }
  render();
}
async function leaveRoom(){
  clearTimeout(net.timer);
  try{ net.unsub && net.unsub(); }catch(e){}
  try{ if(net.nr && net.nr.leave) await net.nr.leave(); else if(net.nr) await net.nr.presence({code:null, pid:null, name:null, host:null, g:null, act:null, rank:null}); }catch(e){}
  net.nr = null; net.code = null; net.isHost = false; net.hostSeen = false; net.hostLost = false; net.unsub = null;
}

  }

}

/* ================= render ================= */
function render(){
  if(animating){ renderPending = true; return; }
  let html;
  if(view==='home') html = vHome();
  else if(view==='setup') html = vSetup();
  else if(view==='online') html = vOnline();
  else if(!G) html = vConnecting();
  else if(G.phase==='closed') html = vClosed();
  else html = ({lobby:vLobby, spin:vSpin, cards:vCards, handoff:vHandoff, rank:vRank, ready:vReady, reveal:vReveal, score:vScore, final:vFinal})[G.phase]();
  const key = view + (G ? ':'+G.phase+':'+G.round+':'+G.turn+':'+G.reveal : '');
  const newScreen = key!==lastKey;
  if(html!==lastHTML){
    const focusId = document.activeElement && document.activeElement.id;
    const caret = focusId && document.activeElement.selectionStart;
    if(newScreen){
      $app.classList.remove('enter'); void $app.offsetWidth; $app.classList.add('enter');
      clearTimeout(enterTimer); enterTimer = setTimeout(()=>$app.classList.remove('enter'), 700);
    }
    $app.innerHTML = html; lastHTML = html;
    if(focusId && /^(myname|joincode|custom|pname-\d+)$/.test(focusId)){
      const el = document.getElementById(focusId);
      if(el){ el.focus(); try{ el.setSelectionRange(caret, caret); }catch(e){} }
    }
  }
  if(newScreen){ window.scrollTo(0,0); lastKey = key; }
  if(sheetOpen && view==='game' && G){ $sheet.innerHTML = vSheet(); $sheet.hidden = false; } else { $sheet.hidden = true; $sheet.innerHTML = ''; }
  afterRender();
}
function afterRender(){
  if(view!=='game' || !G) return;
  // tragamonedas
  if(G.phase==='spin' && G.spin && seenSpin!==G.spin.id) animateSpin();
  // defendete
  if(G.phase==='reveal' && G.defend && G.defend.id!==defendT.id){
    defendT = {id:G.defend.id, end:Date.now()+DEFEND_SECS*1000, k:G.defend.k, beeped:DEFEND_SECS+1, done:false};
    SFX.beep(); vib(40); render(); return;
  }
  // efectos por pantalla nueva
  const fx = G.phase+':'+G.gid+':'+G.round+':'+G.reveal;
  if(fx===lastFx) return;
  lastFx = fx;
  if(G.phase==='reveal'){
    const vid = vic().id, t = (G.rankings[vid]||[])[G.reveal];
    let good;
    if(online() && me.pid!==vid && G.rankings[me.pid]) good = G.rankings[me.pid][G.reveal]===t;
    else good = G.players.some(p=>p.id!==vid && G.rankings[p.id] && G.rankings[p.id][G.reveal]===t);
    if(good){ SFX.hit(); vib(35); } else { SFX.miss(); vib([60,40,60]); }
  } else if(G.phase==='score'){
    const full = Object.values(G.result||{}).some(x=>x.hits===5);
    if(full){ SFX.fanfare(); vib([50,50,50,50,120]); confetti(120); } else SFX.land();
  } else if(G.phase==='final'){ SFX.fanfare(); vib([80,60,80,60,200]); confetti(220); }
  else if(G.phase==='rank' || G.phase==='handoff'){ SFX.tap(); }
}
function confetti(n){
  try{ if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(e){}
  let cv = document.getElementById('confetti');
  if(!cv){ cv = document.createElement('canvas'); cv.id = 'confetti'; cv.setAttribute('aria-hidden','true'); document.body.appendChild(cv); }
  const dpr = Math.min(2, window.devicePixelRatio||1), W = innerWidth, Hh = innerHeight;
  cv.width = W*dpr; cv.height = Hh*dpr;
  const c = cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  const cols = ['#FF5FA2','#FFCB4C','#FFE7A3','#5FE3C0','#62C6FF','#B49BFF'];
  const ps = Array.from({length:n}, ()=>({
    x: W*(.2+Math.random()*.6), y: Hh*.42, vx:(Math.random()-.5)*13, vy:-(5+Math.random()*13),
    a: Math.random()*6, va:(Math.random()-.5)*.35, w:8+Math.random()*9, h:5+Math.random()*6, col:cols[Math.floor(Math.random()*cols.length)]
  }));
  const t0 = performance.now();
  const step = t => {
    c.clearRect(0,0,W,Hh);
    ps.forEach(p=>{
      p.vy += .38; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      c.save(); c.translate(p.x,p.y); c.rotate(p.a);
      c.fillStyle = p.col;
      c.fillRect(-p.w/2,-p.h/2,p.w,p.h); c.restore();
    });
    if(t - t0 < 3200) requestAnimationFrame(step); else c.clearRect(0,0,W,Hh);
  };
  requestAnimationFrame(step);
}
function animateSpin(){
  const el = document.getElementById('reel'); if(!el) return;
  const id = G.spin.id, target = reelY(36 + G.spin.i);
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur = reduce ? 500 : 3400;
  animating = true;
  let last = null, alive = true;
  const watch = () => {
    if(!alive) return;
    try{
      const t = getComputedStyle(el).transform;
      if(t && t!=='none'){ const v = t.split('(')[1].split(')')[0].split(','); const p = Math.round(-(+v[5])/RH); if(last!==null && p!==last) SFX.tick(); last = p; }
    }catch(e){}
    requestAnimationFrame(watch);
  };
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    el.style.transition = `transform ${dur}ms cubic-bezier(.15,.7,.2,1.04)`;
    el.style.transform = `translateY(${target}px)`;
    requestAnimationFrame(watch);
  }));
  setTimeout(()=>{
    alive = false; seenSpin = id; animating = false; renderPending = false;
    SFX.land(); vib(40); render();
  }, dur + 120);
}
setInterval(()=>{
  if(!defendT.id || defendT.done) return;
  const left = Math.max(0, Math.ceil((defendT.end - Date.now())/1000));
  const ring = document.getElementById('defRing'), lbl = document.getElementById('defLeft');
  if(ring) ring.style.setProperty('--p', Math.max(0,(defendT.end-Date.now())/(DEFEND_SECS*1000)));
  if(lbl) lbl.textContent = left;
  if(left<=5 && left>0 && left<defendT.beeped){ defendT.beeped = left; SFX.beep(); }
  if(left<=0){ defendT.done = true; SFX.buzz(); vib(300); if(G && G.phase==='reveal') render(); }
}, 200);

/* ================= acciones de la interfaz ================= */
function T(){ return view==='setup' ? draft : (G && G.phase==='lobby' && net.isHost ? G.settings : null); }
function afterSettings(){ if(view==='setup'){ save(); render(); } else commit(); }
const A = {
  home(){ view='home'; },
  setup(){ if(G && G.mode==='local' && !draft.names.some(x=>x)) draft.names = G.players.map(p=>p.name); view='setup'; sheetOpen=false; },
  online(){ view='online'; net.err=''; getRoom().then(render); },
  resume(){ view='game'; keepAwake(); },
  reopen(){ hostRoom(G.code, false); return 'skip'; },
  rejoin(){ joinRoom(savedJoin.code); return 'skip'; },
  add(){ if(draft.names.length<MAXP){ draft.names.push(''); if(!draft.touched) draft.turns=defaultTurns(draft.names.length);} },
  rm(b){ if(draft.names.length>minPlayers(draft.teams)){ draft.names.splice(+b.dataset.i,1); if(!draft.touched) draft.turns=defaultTurns(draft.names.length);} },
  tdec(){ const s=T(); if(!s) return 'skip'; s.turns=Math.max(1,s.turns-1); s.touched=true; afterSettings(); return 'skip'; },
  tinc(){ const s=T(); if(!s) return 'skip'; s.turns=Math.min(8,s.turns+1); s.touched=true; afterSettings(); return 'skip'; },
  deck(b){ const s=T(); if(!s) return 'skip'; const id=b.dataset.id; s.decks = s.decks.includes(id) ? s.decks.filter(x=>x!==id) : s.decks.concat(id); if(view!=='setup') draft.decks=s.decks.slice(); afterSettings(); return 'skip'; },
  teams(){ const s=T(); if(!s) return 'skip'; s.teams=!s.teams; draft.teams=s.teams;
    if(view==='setup' && !s.teams && draft.names.length<3){ draft.names.push(''); if(!draft.touched) draft.turns=defaultTurns(draft.names.length); }
    afterSettings(); return 'skip'; },
  defend(b){
    if(b.getAttribute('role')==='switch'){ const s=T(); if(!s) return 'skip'; s.defend=!s.defend; draft.defend=s.defend; afterSettings(); return 'skip'; }
    dispatch('defend'); return 'skip';
  },
  start(){
    if(!draft.decks.length) return;
    const players = draft.names.map((nm,i)=>({id:'p'+i, name:cleanName(nm)||((draft.teams?'Equipo ':'Jugador ')+(i+1)), color:PCOL[i], score:0}));
    startGame('local', players, {decks:draft.decks.slice(), turns:draft.turns, teams:draft.teams, defend:draft.defend});
    view='game'; keepAwake(); save();
  },
  create(){
    const nm = cleanName((document.getElementById('myname')||{}).value || me.name);
    if(!nm){ net.err='Poné tu nombre primero.'; return; }
    me.name = nm; save();
    hostRoom(newCode(), true); return 'skip';
  },
  share(){
    const url = inviteURL(), text = `¡Sumate a Mejor Imposible! Código de sala: ${G.code}`;
    if(navigator.share){ navigator.share({title:'Mejor Imposible', text, url}).catch(()=>{}); }
    else copyText(url);
    return 'skip';
  },
  copy(){ copyText(inviteURL()); return 'skip'; },
  noPrefill(){ net.prefill = ''; net.err = ''; },
  join(){
    const nm = cleanName((document.getElementById('myname')||{}).value || me.name);
    me.name = nm; save();
    joinRoom((document.getElementById('joincode')||{}).value); return 'skip';
  },
  leave(){ leaveRoom(); G=null; view='home'; savedJoin=null; save(); },
  startOnline(){ dispatch('start'); return 'skip'; },
  spin(){ if(animating) return 'skip'; const b=document.getElementById('spinBtn'); if(b){ b.disabled=true; b.textContent='Girando…'; } dispatch('spin'); return 'skip'; },
  toCards(){ dispatch('toCards'); return 'skip'; },
  swap(b){ dispatch('swap',{k:+b.dataset.k}); return 'skip'; },
  startRank(){ dispatch('startRank'); return 'skip'; },
  skipMissing(){ dispatch('skipMissing'); return 'skip'; },
  showRank(){ G.phase='rank'; save(); },
  notme(){ myRankKey=''; G.phase='handoff'; save(); },
  pick(b){
    const k=+b.dataset.k, v=+b.dataset.v, d=myRank, prev=d[k], other=d.indexOf(v);
    if(prev===v) d[k]=0; else { if(other>-1 && other!==k) d[other]=prev||0; d[k]=v; }
    justPicked = k+':'+v;
    SFX.tap(); vib(10);
  },
  confirm(){
    if(!myRank.every(x=>x>0)) return 'skip';
    const r = myRank.slice();
    if(!online()){ const p = G.players[(G.victim + G.turn) % G.players.length]; myRankKey=''; dispatch('submitRank',{id:p.id, r}); return 'skip'; }
    net.sentRank = G.gid+':'+G.round;
    if(net.isHost){ if(apply('submitRank',{id:me.pid, r}, me.pid)) commit(); else render(); }
    else { net.nr && net.nr.presence({rank:{gid:G.gid, round:G.round, r}}).catch(()=>{}); render(); }
    SFX.land(); vib(30); return 'skip';
  },
  reveal(){ dispatch('reveal'); return 'skip'; },
  nextReveal(){ dispatch('nextReveal',{at:G.reveal}); return 'skip'; },
  nextRound(){ dispatch('nextRound',{at:G.round}); return 'skip'; },
  final(){ dispatch('final'); return 'skip'; },
  again(){ dispatch('again'); return 'skip'; },
  exit(){
    if(online()){ leaveRoom(); }
    G=null; H=null; savedJoin=null; view = 'home'; save();
  },
  mute(){ muted=!muted; if(!muted){ ac(); SFX.tap(); } save(); },
  menu(){ sheetOpen=true; confirmEnd=false; },
  closeMenu(){ sheetOpen=false; },
  endAsk(){ confirmEnd=true; },
  endNo(){ confirmEnd=false; },
  endYes(){
    sheetOpen=false; confirmEnd=false;
    if(online() && net.isHost){ G.phase='closed'; publishHost(); const n=net; setTimeout(()=>{ leaveRoom(); }, 1500); G=null; H=null; }
    else if(online()){ leaveRoom(); G=null; savedJoin=null; }
    else { G=null; H=null; }
    view='home'; save();
  },
};
document.addEventListener('click', e=>{
  if(!muted) ac();
  if(e.target===$sheet){ sheetOpen=false; render(); return; }
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const f = A[b.dataset.act]; if(!f) return;
  if(f(b)!=='skip') render();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && sheetOpen){ sheetOpen=false; render(); }
  if(e.key==='Enter' && e.target && e.target.id==='joincode'){ A.join(); }
});
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.id && t.id.startsWith('pname-')){ draft.names[+t.dataset.i] = t.value; save(); }
  else if(t.id==='custom'){ draft.custom = t.value; save(); }
  else if(t.id==='myname'){ me.name = cleanName(t.value); save(); }
  else if(t.id==='joincode'){ const v = t.value.toUpperCase().replace(/[^A-Z]/g,''); if(v!==t.value) t.value = v; }
});

/* ================= arranque ================= */
loadSaved();
(function(){
  const hc = (location.hash||'').slice(1).toUpperCase();
  if(/^[A-Z]{4}$/.test(hc)){ net.prefill = hc; view = 'online'; }
})();
render();
getRoom().then(()=>{ if(view==='home' || view==='online') render(); });
</script>
